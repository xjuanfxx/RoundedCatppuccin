name: Actualizar desde los temas originales

on:
  schedule:
    - cron: '0 6 * * 1' # cada lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain src dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src dist
            git commit -m "Actualizar desde RoundedDiscord y Catppuccin"
            git push
          else
            echo "Sin cambios."
          fi
